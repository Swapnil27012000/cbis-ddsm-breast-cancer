experiment:
  name: "cbis_ddsm_pathology_classification"
  description: "Benchmarking ResNet, DenseNet, and EfficientNet on preprocessed CBIS-DDSM mammograms"
  models:
    - "resnet18"
    - "resnet50"
    - "densenet121"
    - "efficientnet_b0"
  input_types:
    - "raw"
    - "denoised_nlm"
    - "denoised_wiener"
    - "enhanced_clahe"
  batch_size: 16
  epochs: 30
  lr: 0.0001
  loss: "focal"
  output_dir: "results/classification"
